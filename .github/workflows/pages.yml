name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # deploy-pages@v5 asks GitHub's API for this run's artifact right
      # after upload-artifact reports success, and that API has been
      # observed to still answer "0 artifacts" for a few seconds - the
      # artifact index lags behind the upload response. Give it a moment
      # to catch up rather than failing the whole deploy over a race.
      - name: Wait for artifact indexing
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
